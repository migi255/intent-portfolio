<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Miguel Mazumder, Software Engineer. Projects in scientific software, research data infrastructure, and simulation.">
    <meta name="color-scheme" content="light dark">
    <link rel="alternate" type="application/json" title="Public engineering evidence" href="/evidence.v1.json">
    <script id="theme-bootstrap">
      {
        let preference = 'system'
        try {
          const stored = localStorage.getItem('intent-portfolio:theme')
          if (stored === 'light' || stored === 'dark') preference = stored
        } catch {
          // Theme selection still works when storage is unavailable.
        }
        const root = document.documentElement
        root.dataset.themePreference = preference
        root.dataset.theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference
      }
    </script>
    <title>Miguel Mazumder | Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
